<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChattingApp Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #071027; color: #e6f4ff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { max-width: 520px; padding: 28px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(11,20,42,.92); }
    h1 { margin: 0 0 10px; }
    p { color: #94a3b8; line-height: 1.7; }
    a { color: #60a5fa; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>ChattingApp saved the app shell for offline use. Reopen a page you visited recently, or reconnect and try again.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
