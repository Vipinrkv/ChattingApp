[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --strict-markers --cov=app --cov-report=term-missing
markers =
    auth: auth endpoint tests
    service: service layer tests
    websocket: websocket connection tests
    integration: integration tests requiring backend services
